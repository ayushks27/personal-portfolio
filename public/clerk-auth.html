<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clerk | Sign in to Purnendu's Portfolio</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --clerk-primary: #6366f1;
      --clerk-primary-hover: #4f46e5;
      --clerk-bg: #09090b;
      --clerk-card-bg: rgba(20, 20, 25, 0.7);
      --clerk-card-border: rgba(63, 63, 70, 0.4);
      --clerk-text: #f4f4f5;
      --clerk-text-muted: #a1a1aa;
      --clerk-input-bg: #18181b;
      --clerk-input-border: #27272a;
      --clerk-input-focus: #3f3f46;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--clerk-bg);
      color: var(--clerk-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Glow Backgrounds */
    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(99, 102, 241, 0) 70%);
      top: -100px;
      left: -100px;
      z-index: 1;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.06) 0%, rgba(168, 85, 247, 0) 70%);
      bottom: -150px;
      right: -100px;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
    }

    .card {
      background-color: var(--clerk-card-bg);
      border: 1px solid var(--clerk-card-border);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 80px rgba(99, 102, 241, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .clerk-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }

    .clerk-logo svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    .clerk-brand {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #e4e4e7 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header {
      text-align: center;
      margin-bottom: 8px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .subtitle {
      font-size: 14px;
      color: var(--clerk-text-muted);
      line-height: 1.5;
    }

    .subtitle a {
      color: var(--clerk-primary);
      text-decoration: none;
      font-weight: 500;
    }

    .subtitle a:hover {
      text-decoration: underline;
    }

    .social-btn {
      width: 100%;
      height: 42px;
      background-color: var(--clerk-input-bg);
      border: 1px solid var(--clerk-input-border);
      border-radius: 8px;
      color: var(--clerk-text);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .social-btn:hover {
      background-color: #202024;
      border-color: #3f3f46;
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #3f3f46;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 4px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #27272a;
    }

    .divider:not(:empty)::before {
      margin-right: .75em;
    }

    .divider:not(:empty)::after {
      margin-left: .75em;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .label {
      font-size: 12px;
      font-weight: 500;
      color: var(--clerk-text-muted);
      letter-spacing: 0.2px;
    }

    .input-field {
      width: 100%;
      height: 40px;
      background-color: var(--clerk-input-bg);
      border: 1px solid var(--clerk-input-border);
      border-radius: 8px;
      padding: 0 12px;
      color: white;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--clerk-primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
      background-color: var(--clerk-bg);
    }

    .primary-btn {
      width: 100%;
      height: 40px;
      background-color: var(--clerk-primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .primary-btn:hover {
      background-color: var(--clerk-primary-hover);
    }

    .clerk-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: var(--clerk-text-muted);
      margin-top: 8px;
      border-top: 1px solid #18181b;
      padding-top: 16px;
    }

    .clerk-footer svg {
      width: 12px;
      height: 12px;
      fill: var(--clerk-text-muted);
    }

    .clerk-footer a {
      color: var(--clerk-text-muted);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .clerk-footer a:hover {
      color: white;
    }

    /* Screen State Switching animations */
    .hidden-state {
      display: none !important;
    }

    /* Loading Spinner Styles */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- SIGN IN CARD -->
    <div id="signin-card" class="card">
      <div class="logo-container">
        <div class="clerk-logo">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
        </div>
        <span class="clerk-brand">Clerk</span>
      </div>

      <div class="header">
        <h2 class="title">Sign in</h2>
        <p class="subtitle">to continue to <span style="font-weight: 600; color: #ffffff;">Purnendu's Portfolio</span></p>
      </div>

      <button class="social-btn" onclick="handleSocialLogin('Google')">
        <!-- Google SVG -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <button class="social-btn" onclick="handleSocialLogin('GitHub')">
        <!-- Github SVG -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
          <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
        </svg>
        <span>Continue with GitHub</span>
      </button>

      <div class="divider">or</div>

      <form id="signin-form" onsubmit="handleEmailSubmit(event, 'signin')" class="form-group">
        <div class="form-group">
          <label class="label" for="signin-email">Email address</label>
          <input class="input-field" type="email" id="signin-email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="primary-btn" id="signin-submit-btn">
          Continue
        </button>
      </form>

      <p class="subtitle" style="text-align: center; margin-top: 4px;">
        No account? <a href="#" onclick="toggleCards('signup')">Sign up</a>
      </p>

      <div class="clerk-footer">
        <a href="https://clerk.com" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
          <span>Secured by Clerk</span>
        </a>
      </div>
    </div>

    <!-- SIGN UP CARD -->
    <div id="signup-card" class="card hidden-state">
      <div class="logo-container">
        <div class="clerk-logo">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
        </div>
        <span class="clerk-brand">Clerk</span>
      </div>

      <div class="header">
        <h2 class="title">Create your account</h2>
        <p class="subtitle">to continue to <span style="font-weight: 600; color: #ffffff;">Purnendu's Portfolio</span></p>
      </div>

      <button class="social-btn" onclick="handleSocialLogin('Google')">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span>Sign up with Google</span>
      </button>

      <button class="social-btn" onclick="handleSocialLogin('GitHub')">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
          <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
        </svg>
        <span>Sign up with GitHub</span>
      </button>

      <div class="divider">or</div>

      <form id="signup-form" onsubmit="handleEmailSubmit(event, 'signup')" class="form-group">
        <div class="form-group">
          <label class="label" for="signup-name">Full Name</label>
          <input class="input-field" type="text" id="signup-name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label class="label" for="signup-email">Email address</label>
          <input class="input-field" type="email" id="signup-email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="primary-btn" id="signup-submit-btn">
          Create Account
        </button>
      </form>

      <p class="subtitle" style="text-align: center; margin-top: 4px;">
        Already have an account? <a href="#" onclick="toggleCards('signin')">Sign in</a>
      </p>

      <div class="clerk-footer">
        <a href="https://clerk.com" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
          <span>Secured by Clerk</span>
        </a>
      </div>
    </div>

  </div>

  <script>
    function toggleCards(state) {
      const signin = document.getElementById('signin-card');
      const signup = document.getElementById('signup-card');
      if (state === 'signup') {
        signin.classList.add('hidden-state');
        signup.classList.remove('hidden-state');
      } else {
        signup.classList.add('hidden-state');
        signin.classList.remove('hidden-state');
      }
    }

    function handleSocialLogin(provider) {
      const activeCard = document.querySelector('.card:not(.hidden-state)');
      // Disable buttons and show connecting loader
      const buttons = activeCard.querySelectorAll('.social-btn, .primary-btn, input');
      buttons.forEach(b => {
        b.style.pointerEvents = 'none';
        b.style.opacity = '0.5';
      });

      // Find the clicked button and inject spinner
      const targetBtn = Array.from(activeCard.querySelectorAll('.social-btn')).find(b => b.innerText.includes(provider));
      if (targetBtn) {
        const originalContent = targetBtn.innerHTML;
        targetBtn.innerHTML = '<div class="spinner"></div><span>Connecting to ' + provider + '...</span>';
      }

      // Simulate a sleek 1.2s OAuth handshake delay
      setTimeout(() => {
        const name = provider === 'Google' ? 'Google Guest' : 'GitHub Developer';
        const email = provider === 'Google' ? 'google.visitor@gmail.com' : 'github.developer@gmail.com';
        const photoSeed = provider.toLowerCase();
        
        const user = {
          uid: 'clerk-' + provider.toLowerCase() + '-' + Math.random().toString(36).substring(2, 9),
          email: email,
          displayName: name,
          photoURL: 'https://api.dicebear.com/7.x/pixel-art/svg?seed=' + photoSeed,
          role: 'user'
        };

        // Emit authentic postMessage payload back to parent context
        if (window.opener) {
          window.opener.postMessage({
            type: 'CLERK_AUTH_SUCCESS',
            user: user
          }, '*');
        }
        window.close();
      }, 1200);
    }

    function handleEmailSubmit(event, state) {
      event.preventDefault();
      
      const emailInput = document.getElementById(state + '-email');
      const nameInput = document.getElementById(state + '-name');
      const submitBtn = document.getElementById(state + '-submit-btn');
      
      const email = emailInput.value.trim();
      const name = nameInput ? nameInput.value.trim() : email.split('@')[0].replace('.', ' ').replace(/\b\w/g, c => c.toUpperCase());
      
      submitBtn.disabled = true;
      submitBtn.style.pointerEvents = 'none';
      submitBtn.innerHTML = '<div class="spinner"></div>';
      
      setTimeout(() => {
        const isAdmin = email === 'admin@gmail.com';
        const user = {
          uid: 'clerk-email-' + Math.random().toString(36).substring(2, 9),
          email: email,
          displayName: name,
          photoURL: 'https://api.dicebear.com/7.x/pixel-art/svg?seed=' + encodeURIComponent(name),
          role: isAdmin ? 'admin' : 'user'
        };

        if (window.opener) {
          window.opener.postMessage({
            type: 'CLERK_AUTH_SUCCESS',
            user: user
          }, '*');
        }
        window.close();
      }, 1200);
    }
  </script>
</body>
</html>
